name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/windows-release.yml"
      - "integrations/fqapp/rust/**"
      - "integrations/fqapp/assets/**"
      - "start-docleaf.ps1"
      - "setup-and-start-docleaf.ps1"
      - "一键启动-Windows.bat"
      - "一键启动.command"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/fqapp/rust
      - name: Build source service
        shell: pwsh
        run: cargo build --release --manifest-path integrations/fqapp/rust/Cargo.toml --bin docleaf_bridge
      - name: Assemble package
        shell: pwsh
        run: |
          git archive --format=zip --output docleaf-source.zip HEAD
          New-Item -ItemType Directory -Force package | Out-Null
          Expand-Archive docleaf-source.zip package
          Copy-Item integrations/fqapp/rust/target/release/docleaf_bridge.exe package/integrations/fqapp/docleaf_bridge.exe
          Compress-Archive -Path package/* -DestinationPath DocLeaf-Windows-x64.zip -CompressionLevel Optimal
      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: DocLeaf-Windows-x64.zip

  mac:
    strategy:
      matrix:
        include:
          - runner: macos-15
            suffix: Apple-Silicon
          - runner: macos-15-intel
            suffix: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: integrations/fqapp/rust
          key: ${{ matrix.suffix }}
      - name: Build source service
        run: cargo build --release --manifest-path integrations/fqapp/rust/Cargo.toml --bin docleaf_bridge
      - name: Assemble package
        run: |
          mkdir -p package/DocLeaf
          git archive HEAD | tar -x -C package/DocLeaf
          cp integrations/fqapp/rust/target/release/docleaf_bridge package/DocLeaf/integrations/fqapp/docleaf_bridge
          chmod +x package/DocLeaf/integrations/fqapp/docleaf_bridge package/DocLeaf/一键启动.command
          ditto -c -k --sequesterRsrc --keepParent package/DocLeaf "DocLeaf-macOS-${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.suffix }}
          path: DocLeaf-macOS-${{ matrix.suffix }}.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-package"
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: "macos-*"
          path: release-assets
          merge-multiple: true
      - name: Publish latest desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          notes="连续阅读：章末继续下滑自动加载下一章，支持失败重试和位置恢复。评论文字比正文小 2px。包含 Windows x64、macOS Apple Silicon 和 macOS Intel 预编译包，无需安装 Rust 或 C++ Build Tools。"
          if gh release view desktop-latest --repo "$repo" >/dev/null 2>&1; then
            gh release upload desktop-latest release-assets/*.zip --repo "$repo" --clobber
            gh api --method PATCH "repos/$repo/git/refs/tags/desktop-latest" -f sha="$sha" -F force=true
            gh release edit desktop-latest --repo "$repo" --target "$sha" --title "DocLeaf 桌面预编译版" --notes "$notes" --latest
          else
            gh release create desktop-latest release-assets/*.zip --repo "$repo" --target "$sha" --title "DocLeaf 桌面预编译版" --notes "$notes" --latest
          fi

